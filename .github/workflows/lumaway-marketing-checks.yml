name: Lumaway marketing checks

on:
  pull_request:
    paths:
      - "apps/marketing/**"
      - ".github/workflows/lumaway-marketing-checks.yml"
  push:
    branches: [main]
    paths:
      - "apps/marketing/**"
      - ".github/workflows/lumaway-marketing-checks.yml"

permissions:
  contents: read

jobs:
  validate-marketing:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/marketing
    env:
      NEXT_PUBLIC_SITE_URL: https://www.lumaway.online
      NEXT_PUBLIC_APP_URL: https://www.lumaway.online/app.lumaway
      MARKETING_INDEXABLE: "false"
      VERCEL_ENV: preview
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/marketing/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
