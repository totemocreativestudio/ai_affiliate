name: Lumaway CI Gate

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

concurrency:
  group: lumaway-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: build-verification-key
      SUPABASE_PUBLISHABLE_KEY: build-verification-key
      SUPABASE_SECRET_KEY: build-verification-secret
      NEXT_PUBLIC_APP_URL: https://www.lumaway.online
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate database migrations
        run: node scripts/lumaway-db-migration-check.mjs

      - name: Validate routes
        run: node scripts/lumaway-route-check.mjs

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build

      - name: Smoke test production routes
        shell: bash
        run: |
          npm run start -- -p 3100 >/tmp/lumaway-next.log 2>&1 &
          NEXT_PID=$!
          trap 'kill $NEXT_PID 2>/dev/null || true' EXIT
          node scripts/lumaway-http-smoke.mjs
